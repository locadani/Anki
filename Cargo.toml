[package]
name = "Anki"
version = "0.1.0"
edition = "2024"

[dependencies]
argon2 = "0.5.3"
askama = "0.14.0"
axum = { version = "0.8", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "tls-rustls", "macros", "migrate"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower-sessions = "0.15.0"
