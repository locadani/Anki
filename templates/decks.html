Create deck:
<form action="/deck" method="POST">
    <label for="deck_name">Deck name:</label> <input type="text" name="deck_name" id="deck_name" required/>
    <button type="submit">Confirm</button>
</form>
<br>
<h1>Decks</h1>
<ul>
{% if decks.is_empty() %}
    <li>No decks</li>
{% else %}
    {% for deck in decks %}
        <li>{{ deck.name }}</li>
    {% endfor %}
{% endif %}
</ul>
<form action="/logout" method="POST">
    <button type="submit">Logout</button>
</form>
